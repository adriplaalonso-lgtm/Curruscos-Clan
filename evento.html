<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Evento — Curruscos Clan</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <a href="index.html" class="logo">
            CURRUSCOS.
        </a>

        <nav id="mainNav">
            <a href="index.html">Inicio</a>
            <a href="miembros.html">Miembros</a>
            <a href="historia.html">Historia</a>
            <a href="recuerdos.html">Recuerdos</a>
            <a href="eventos.html" class="active">Eventos</a>
        </nav>

        <button id="menuButton" class="menu-button">
            ☰
        </button>

    </header>


    <main>

        <section class="page-hero">

            <div class="container">

                <span class="eyebrow">
                    EVENTO
                </span>

                <h1 id="eventTitle">
                    Cargando...
                </h1>

                <p id="eventDescription"></p>

            </div>

        </section>


        <section class="section">

            <div class="container">

           <div id="eventInfo"></div>

<div class="section-heading" style="margin-top: 50px;">
    <span class="eyebrow">ORGANIZACIÓN</span>
    <h2>Participantes</h2>
    <p>¿Quién viene al evento?</p>
</div>

<div id="participantsList"></div>

            </div>

        </section>

    </main>


    <footer class="footer">

        <div class="container">

            <p>
                CURRUSCOS CLAN © 2026
            </p>

        </div>

    </footer>


    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

    <script>

        function loadEventPage() {

            const params = new URLSearchParams(window.location.search);
            const eventId = params.get("id");

            const events =
                JSON.parse(localStorage.getItem("curruscos_events")) || [];

            const event = events.find(
                e => String(e.id) === String(eventId)
            );

            if (!event) {

                document.getElementById("eventTitle").textContent =
                    "Evento no encontrado";

                document.getElementById("eventDescription").textContent =
                    "Este evento no existe o ha sido eliminado.";

                return;
            }

            document.getElementById("eventTitle").textContent =
                event.title;

            document.getElementById("eventDescription").textContent =
                event.description || "";

            document.getElementById("eventInfo").innerHTML = `

                <div class="event-card">

                    <p>
                        📅 <strong>Fecha:</strong>
                        ${event.date || "Sin fecha"}
                    </p>

                    <p>
                        🕐 <strong>Hora:</strong>
                        ${event.time || "Sin hora"}
                    </p>

                    <p>
                        📍 <strong>Lugar:</strong>
                        ${event.location || "Sin lugar"}
                    </p>

                </div>

            `;
        }

        loadEventPage();

    </script>

</body>

</html>
